<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lector NFC (Android)</title>
  <style>
    body{font-family:system-ui,Arial;margin:24px;max-width:720px}
    button{padding:12px 16px;font-size:16px;cursor:pointer}
    .box{margin-top:16px;padding:12px;border:1px solid #ddd;border-radius:10px}
    .ok{color:#0a7}
    .err{color:#c00}
    pre{white-space:pre-wrap;word-break:break-word}
  </style>
</head>
<body>
  <h1>Lector NFC (Web NFC)</h1>
  <p>Funciona en <b>Android</b> con Chrome/Edge y solo lee <b>tags NDEF</b>. En iPhone no funciona desde web.</p>

  <button id="btnStart">Iniciar lectura NFC</button>
  <button id="btnStop" disabled>Detener</button>

  <div class="box">
    <div id="status">Estado: esperando…</div>
    <div style="margin-top:10px"><b>Última lectura:</b></div>
    <pre id="out">(nada aún)</pre>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    let abortCtrl = null;

    function setStatus(msg, cls="") {
      const el = $("status");
      el.className = cls;
      el.textContent = "Estado: " + msg;
    }

    function prettyRecord(record) {
      // record.recordType: "text", "url", "mime", "unknown", etc.
      const base = {
        recordType: record.recordType,
        mediaType: record.mediaType || null,
        id: record.id || null,
        encoding: record.encoding || null,
        lang: record.lang || null
      };

      // data puede venir como string / DataView / etc.
      let data = record.data;
      if (data && typeof data !== "string") {
        // intentamos convertir a texto si es DataView/ArrayBuffer
        try {
          const u8 = new Uint8Array(data.buffer || data);
          data = new TextDecoder().decode(u8);
        } catch (e) {
          data = "[dato binario]";
        }
      }
      return { ...base, data: data ?? null };
    }

    async function startNfc() {
      if (!("NDEFReader" in window)) {
        setStatus("Este navegador no soporta Web NFC. Usa Chrome/Edge en Android.", "err");
        return;
      }

      // Web NFC suele requerir gesto del usuario (click) y HTTPS
      try {
        abortCtrl = new AbortController();
        const reader = new NDEFReader();

        setStatus("Acerca una tarjeta/tag NFC…", "ok");

        await reader.scan({ signal: abortCtrl.signal });

        reader.onreadingerror = () => {
          setStatus("Error leyendo NFC. Intenta de nuevo acercando el tag.", "err");
        };

        reader.onreading = (event) => {
          const { serialNumber, message } = event;

          const records = [];
          for (const record of message.records) {
            records.push(prettyRecord(record));
          }

          const payload = {
            serialNumber: serialNumber || null,
            timestamp: new Date().toISOString(),
            records
          };

          $("out").textContent = JSON.stringify(payload, null, 2);
          setStatus("Leído ✅ (si no vuelve a leer, separa y vuelve a acercar el tag)", "ok");

          // AQUÍ: si quieres enviarlo a tu servidor/API
          // fetch("https://tuservidor.com/api/nfc", {
          //   method: "POST",
          //   headers: { "Content-Type": "application/json" },
          //   body: JSON.stringify(payload),
          // });
        };

        $("btnStart").disabled = true;
        $("btnStop").disabled = false;

      } catch (e) {
        setStatus("No se pudo iniciar: " + (e?.message || String(e)), "err");
      }
    }

    function stopNfc() {
      if (abortCtrl) abortCtrl.abort();
      abortCtrl = null;
      setStatus("Lectura detenida.", "");
      $("btnStart").disabled = false;
      $("btnStop").disabled = true;
    }

    $("btnStart").addEventListener("click", startNfc);
    $("btnStop").addEventListener("click", stopNfc);
  </script>
</body>
</html>
